name: Auto-Sync Blogs from Google Sheets

on:
  schedule:
    # Runs automatically every day at midnight UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows you to manually trigger it anytime from GitHub

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to push the updated blogsData.js back to master

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Google Sheets Sync Script
        run: python update_blogs.py

      - name: Commit and push if blogsData.js changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./src/data/blogsData.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: update blogsData.js from Google Sheets" && git push)