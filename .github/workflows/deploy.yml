name: Sync Google Sheets & Update Blogs

on:
  schedule:
    # Runs automatically every 5 minutes
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual triggering anytime

permissions:
  contents: write

jobs:
  sync_blogs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      - name: Run Google Sheets Sync Script
        run: python update_blogs.py

      - name: Commit and push if blogsData.js changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./src/data/blogsData.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync: update blogsData.js from Google Sheets" && git push)
